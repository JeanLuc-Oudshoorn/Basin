[project]
name = "basin"
version = "0.1.0"
description = "RWKV-7 time-series foundation model with approximately 450 million parameters"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.12.0",
    "loguru>=0.7,<1",
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "plotly>=6,<7",
    "scipy",
    "statsmodels>=0.14,<1",
    "psutil>=7.2.2",
    "chronos-forecasting==2.3.2",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git", rev = "a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff" }
torch = [
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.optional-dependencies]
data = ["numpy", "scipy", "pandas", "matplotlib", "pyarrow", "networkx"]
validation = ["prophet>=1.1.5,<2", "numpy", "pandas", "pyarrow"]
benchmarks = ["timestral"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# These entry points support direct execution by setting sys.path before imports.
"tests/*.py" = ["E402"]
"src/04_creating_embeddings/embed.py" = ["E402"]
"src/05_model_training/train.py" = ["E402"]
"src/05_model_training/capacity_test.py" = ["E402"]
"src/06_holdout_test/holdout_test.py" = ["E402"]
"src/07_forecasting/forecast.py" = ["E402"]
"src/02_data_validation/validate_generated_data.py" = ["E402"]
"src/01_data_generation/generate_operational_data.py" = ["E402"]
"src/01_data_generation/preview_fourier_seasons.py" = ["E402"]

[tool.bandit]
exclude_dirs = [".venv", ".venv-wsl", "third_party"]

[tool.bandit.assert_used]
# Assertions are intentional test checks in these smoke/verification entry points.
skips = ["*/tests/*", "*/smoke_rwkv7_timeseries.py", "*/smoke_basin.py", "*/scripts/verify_cached_rwkv7.py", "*/scripts/verify_training_protocol.py", "*/scripts/verify_epoch_resume.py", "*/scripts/verify_training_speed.py"]
